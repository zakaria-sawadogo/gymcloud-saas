name: gymcloud_mobile
description: Application mobile GymCloud — unique pour tous les profils (Adhérent, Coach, Gestionnaire, Propriétaire), l'écran affiché dépend du rôle réel après connexion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Réseau & état
  dio: ^5.7.0                    # client HTTP avec intercepteurs (refresh token automatique)
  provider: ^6.1.2                # gestion d'état simple, cohérente avec l'équipe backend NestJS/DI

  # Stockage sécurisé
  flutter_secure_storage: ^9.2.2  # jetons JWT jamais en SharedPreferences en clair

  # QR Code
  qr_flutter: ^4.1.0               # affichage du QR code adhérent (§6, écran d'accès rapide)
  mobile_scanner: ^7.0.0           # scan QR côté app Gestionnaire (contrôle d'accès mobile) + auto-pointage adhérent — 7.x requis pour Android 16 (6.0.11 plante sur Galaxy S23/Android 16)
  url_launcher: ^6.3.1             # ouvrir le site public de la salle dans le navigateur
  path_provider: ^2.1.5            # dossier temporaire pour enregistrer la carte de membre (PDF) avant partage
  share_plus: ^10.1.4              # partager/enregistrer la carte de membre téléchargée

  # UI & formatage
  intl: ^0.19.0                    # dates et montants localisés (fr_FR)
  cupertino_icons: ^1.0.8

  # Notifications push (§12.x — préparation, intégration effective avec le module Notifications)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# §14.x — Icône de l'app, reprenant le vrai logo de marque GymCloud
# (nuage bicolore navy/turquoise avec haltère et flèche montante) —
# jusqu'ici l'icône par défaut de Flutter s'affichait encore sur
# l'écran d'accueil. Exécuter `dart run flutter_launcher_icons` après
# `flutter pub get` pour générer les fichiers natifs Android/iOS à
# partir de ces sources — non fait automatiquement ici, cette commande
# doit tourner en local (accès au dossier android/ios, absent de cet
# environnement).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3DFF9A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
